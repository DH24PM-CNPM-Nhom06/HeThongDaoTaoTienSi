services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dtms}
      MARIADB_USER: ${DB_USER:-dtms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping --protocol=tcp -h 127.0.0.1 -u root -p"$${MARIADB_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-local/dtms}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Backend/DTMS.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${DB_NAME:-dtms};User=${DB_USER:-dtms};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-DTMS_Api}
      Jwt__Audience: ${JWT_AUDIENCE:-DTMS_Client}
      UploadPath: /app/uploads
      Frontend__ResetUrl: "${FRONTEND_PUBLIC_URL:-http://localhost:4173}/reset.html"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - dtms_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-local/dtms}/frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Demo Frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
  dtms_uploads:

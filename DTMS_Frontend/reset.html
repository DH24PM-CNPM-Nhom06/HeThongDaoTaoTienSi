<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DTMS | Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/management.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .reset-card { width: min(480px, 100%); background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 28px; box-shadow: var(--shadow-card); }
    .reset-card h1 { margin: 0 0 8px; color: var(--uni-blue-900); font-size: 1.3rem; }
    .reset-card p { color: var(--text-muted); font-size: .85rem; margin: 0 0 16px; }
    .reset-status { padding: 10px 12px; border-radius: 8px; font-size: .82rem; margin: 0 0 14px; }
    .reset-status.is-error { color: #991b1b; background: #fef2f2; }
    .reset-status.is-ok { color: #166534; background: #f0fdf4; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Đặt lại mật khẩu</h1>
    <p>Nhập mật khẩu mới cho tài khoản DTMS. Mật khẩu tối thiểu 8 ký tự, gồm cả chữ và số.</p>
    <p id="reset-status" class="reset-status" role="status" hidden></p>
    <form id="form-reset-password">
      <div class="mgmt-form-group">
        <label for="reset-password">Mật khẩu mới:</label>
        <input id="reset-password" type="password" autocomplete="new-password" required />
      </div>
      <div class="mgmt-form-group">
        <label for="reset-password-confirm">Nhập lại mật khẩu mới:</label>
        <input id="reset-password-confirm" type="password" autocomplete="new-password" required />
      </div>
      <div style="display:flex; justify-content:space-between; gap:10px; margin-top:16px;">
        <a class="btn-mgmt btn-mgmt-secondary" href="index.html">Về trang đăng nhập</a>
        <button type="submit" class="btn-mgmt btn-mgmt-primary">Đặt lại mật khẩu</button>
      </div>
    </form>
  </main>
  <script src="js/runtime-config.js" defer></script>
  <script src="js/core/config.js" defer></script>
  <script src="js/core/api.js" defer></script>
  <script>
    // Đặt lại mật khẩu: POST /api/Auth/dat-lai-mat-khau { token, newPassword } (DOCX §2).
    // Token lấy từ liên kết trong email: reset.html?token=...
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("form-reset-password");
      const status = document.getElementById("reset-status");
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const showStatus = (message, ok) => {
        status.hidden = false;
        status.textContent = message;
        status.classList.toggle("is-ok", !!ok);
        status.classList.toggle("is-error", !ok);
      };
      if (!token) {
        showStatus("Liên kết không hợp lệ. Vui lòng dùng liên kết trong email đặt lại mật khẩu.");
        form.querySelector('[type="submit"]').disabled = true;
        return;
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("reset-password").value;
        const confirm = document.getElementById("reset-password-confirm").value;
        if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
          showStatus("Mật khẩu mới phải có ít nhất 8 ký tự, gồm cả chữ và số.");
          return;
        }
        if (password !== confirm) {
          showStatus("Mật khẩu nhập lại không khớp.");
          return;
        }
        const submitButton = form.querySelector('[type="submit"]');
        submitButton.disabled = true;
        try {
          const result = await window.DTMS_API.resetPassword(token, password);
          showStatus(result?.message || result?.Message || "Đặt lại mật khẩu thành công. Vui lòng đăng nhập lại.", true);
          form.reset();
        } catch (error) {
          showStatus(error?.detail || error?.message || "Không đặt lại được mật khẩu. Liên kết có thể đã hết hạn.");
        } finally {
          submitButton.disabled = false;
        }
      });
    });
  </script>
</body>
</html>

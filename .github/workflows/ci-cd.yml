name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Backend/DTMS.Api/DTMS.Api.slnx

      - name: Build backend
        run: dotnet build Backend/DTMS.Api/DTMS.Api.slnx --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DTMS_Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: DTMS_Frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: DTMS_Frontend
        run: npx playwright install --with-deps chromium

      - name: Check frontend sources
        working-directory: DTMS_Frontend
        run: |
          npm run check
          npm run check:api
          node scripts/test-api-contracts.cjs
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/DTMS.Api/Dockerfile
          push: false
          tags: dtms-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DTMS_Frontend/Dockerfile
          push: false
          tags: dtms-frontend:ci

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/DTMS.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}/backend:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}/backend:sha-${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DTMS_Frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}/frontend:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}/frontend:sha-${{ github.sha }}
